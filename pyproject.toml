[project]
name = "stargate"
version = "0.1.0"
description = "StarGate Research Program — real-physics wormhole simulator and theory ledger"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Anthony Snider", email = "lordbasilaiassistant@gmail.com" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist>=3"]

[project.urls]
Homepage = "https://github.com/lordbasilaiassistant-sudo/StarGate3d"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
